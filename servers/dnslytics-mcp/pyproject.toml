[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnslytics-mcp"
version = "1.0.0"
description = "MCP server for DNSlytics - online investigation tool for domains, IPs, and tracking codes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ReconStack" }
]
keywords = ["mcp", "dnslytics", "osint", "dns", "domain", "investigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "curl_cffi>=0.5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
dnslytics-mcp = "dnslytics_mcp:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["."]
