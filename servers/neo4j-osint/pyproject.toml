[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-osint"
version = "1.0.0"
description = "Neo4j Graph Database MCP Server for OSINT Investigations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "neo4j>=5.15.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "networkx>=3.2.0",
]

[project.scripts]
neo4j-osint = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
