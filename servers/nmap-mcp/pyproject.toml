[project]
name = "nmap-mcp"
version = "1.0.0"
description = "NMAP MCP server for network scanning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
nmap-mcp = "nmap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nmap_mcp"]
